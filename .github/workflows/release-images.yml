name: Release SCIP images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: scip-image-release
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/rust.yml

  qualification:
    uses: ./.github/workflows/qualification.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      tags: ${{ steps.release.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo run --locked --release --bin release-metadata

  images:
    needs: [validation, qualification, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphit-scip-${{ matrix.family }}
          tags: ${{ needs.version.outputs.tags }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.family }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.family }}
          cache-to: type=gha,scope=${{ matrix.family }},mode=max
